<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<title>Suno Prompt Generator — Late Blo0om</title>
<style>
  :root {
    --bg: #050507;
    --panel: #0a0a0a;
    --border: #1e1e1e;
    --text: #e8e0d4;
    --muted: #666;
    --faint: #444;
    --niia: #00e5ff;
    --grey: #c9a063;
    --accent: var(--niia);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
  }
  header {
    border-bottom: 1px solid #1a1a1a;
    padding: 32px 40px;
    background: linear-gradient(180deg, #0a0a0c 0%, #050507 100%);
  }
  .eyebrow {
    font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 8px;
    font-family: monospace; transition: color 0.3s;
  }
  h1 { font-family: 'Jost', sans-serif; font-weight: 200; letter-spacing: 0.04em; font-size: clamp(28px, 4vw, 44px); letter-spacing: -0.02em; line-height: 1.1; }
  h1 em { color: var(--accent); transition: color 0.3s; }
  .tagline { font-size: 12px; color: var(--muted); margin-top: 12px; font-family: monospace; }
  main { padding: 32px 40px 80px; max-width: 900px; }
  label {
    display: block; font-size: 11px; letter-spacing: 0.25em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 10px; font-family: monospace;
  }
  label span { color: #555; text-transform: none; letter-spacing: 0.05em; }
  input, textarea, select {
    width: 100%; background: #0f0f0f; border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 16px; color: var(--text);
    font-size: 14px; font-family: 'Outfit', sans-serif; outline: none;
    transition: border-color 0.2s;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; line-height: 1.6; }
  .field { margin-bottom: 24px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .row-13 { display: grid; grid-template-columns: 1fr 2fr; gap: 16px; }
  @media (max-width: 640px) { .row, .row-13 { grid-template-columns: 1fr; } main, header { padding-left: 20px; padding-right: 20px; } }

  .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 32px; }
  @media (max-width: 640px) { .mode-grid { grid-template-columns: 1fr; } }
  .mode-btn {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px; cursor: pointer; text-align: left;
    font-family: 'Outfit', sans-serif; color: var(--text); transition: all 0.2s;
  }
  .mode-btn .m-name { font-size: 16px; margin-bottom: 4px; }
  .mode-btn .m-sub { font-size: 11px; color: var(--muted); font-family: monospace; letter-spacing: 0.05em; margin-bottom: 8px; }
  .mode-btn .m-desc { font-size: 12px; color: #888; line-height: 1.5; }
  .mode-btn.active-niia { border-color: var(--niia); background: rgba(0,229,255,0.06); }
  .mode-btn.active-niia .m-name { color: var(--niia); }
  .mode-btn.active-grey { border-color: var(--grey); background: rgba(201,160,99,0.06); }
  .mode-btn.active-grey .m-name { color: var(--grey); }

  .stack-note {
    background: var(--panel); border: 1px solid #1a1a1a; border-radius: 8px;
    padding: 14px 18px; margin-bottom: 24px; font-size: 12px;
    color: var(--muted); font-family: monospace; line-height: 1.6;
  }
  .stack-note strong { color: var(--accent); }
  .check-row {
    display: flex; align-items: center; gap: 10px; cursor: pointer;
    font-size: 13px; color: #888; font-family: monospace; margin-bottom: 24px;
  }
  .check-row input { width: auto; accent-color: var(--accent); }

  #generate {
    background: var(--accent); color: var(--bg); border: none; border-radius: 8px;
    padding: 14px 32px; font-size: 14px; font-weight: 600;
    letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer;
    font-family: monospace; transition: all 0.2s;
  }
  #generate:disabled { opacity: 0.4; cursor: not-allowed; }

  #output { margin-top: 40px; display: none; }
  .out-card {
    background: var(--panel); border-radius: 12px; overflow: hidden;
    border: 1px solid rgba(0,229,255,0.2);
  }
  .out-header {
    padding: 20px 32px; border-bottom: 1px solid #1a1a1a;
    display: flex; justify-content: space-between; align-items: center;
  }
  .out-label {
    font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--accent); font-family: monospace;
  }
  #copy-btn {
    background: #151515; border: 1px solid #2a2a2a; color: #888;
    border-radius: 6px; padding: 8px 20px; font-size: 11px;
    letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer;
    font-family: monospace; transition: all 0.2s;
  }
  #copy-btn.copied { background: #1a3a1a; border-color: #34d399; color: #34d399; }
  .out-body { padding: 32px; }
  .out-section-label {
    font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
    color: #555; margin-bottom: 12px; font-family: monospace;
  }
  .out-box {
    background: var(--bg); border: 1px solid rgba(0,229,255,0.13);
    border-radius: 8px; padding: 20px; font-family: monospace;
    font-size: 14px; line-height: 1.7; word-break: break-word;
    margin-bottom: 24px; white-space: pre-wrap;
  }
  .out-box.structure { color: #888; font-size: 13px; border-color: #1a1a1a; margin-bottom: 0; }
  .out-box.brief { font-family: 'Outfit', sans-serif; line-height: 1.8; margin-bottom: 0; }

  .preset-wrap { margin-bottom: 28px; }
  .preset-group { margin-bottom: 14px; }
  .preset-group-label {
    font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase;
    color: #555; font-family: monospace; margin-bottom: 8px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: #0f0f0f; border: 1px solid var(--border); border-radius: 999px;
    padding: 7px 15px; font-size: 12px; color: #999; cursor: pointer;
    font-family: monospace; letter-spacing: 0.04em; transition: all 0.18s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.on { border-color: var(--accent); color: var(--bg); background: var(--accent); }
  .chip .x { margin-left: 8px; color: #555; }
  .chip .x:hover { color: #ff6b6b; }
  .chip.on .x { color: var(--bg); }
  .save-row { display: flex; gap: 8px; margin-top: 10px; }
  .save-row input {
    width: 220px; padding: 7px 14px; font-size: 12px; font-family: monospace;
    border-radius: 999px; letter-spacing: 0.04em;
  }
  .save-row button {
    background: #0f0f0f; border: 1px solid var(--border); border-radius: 999px;
    padding: 7px 15px; font-size: 12px; color: #999; cursor: pointer;
    font-family: monospace; letter-spacing: 0.04em; transition: all 0.18s; white-space: nowrap;
  }
  .save-row button:hover { border-color: var(--accent); color: var(--accent); }
  .no-custom { font-size: 11px; color: #444; font-family: monospace; letter-spacing: 0.05em; align-self: center; }
  .footer-note {
    margin-top: 16px; font-size: 11px; color: var(--faint);
    font-family: monospace; letter-spacing: 0.05em;
  }
  .vault { margin-bottom: 28px; }
  #vault-body { margin-top: 12px; }
  #vault-search { margin-bottom: 8px; }
  .vault-count {
    font-size: 10px; color: #444; font-family: monospace;
    letter-spacing: 0.08em; margin-bottom: 8px;
  }
  .vault-list {
    max-height: 340px; overflow-y: auto;
    border: 1px solid var(--border); border-radius: 8px; background: var(--panel);
  }
  .v-cat {
    font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase;
    color: #555; font-family: monospace; padding: 12px 14px 4px;
    position: sticky; top: 0; background: var(--panel);
  }
  .v-row {
    display: flex; align-items: baseline; gap: 10px;
    padding: 6px 14px; cursor: pointer;
    font-family: monospace; font-size: 12px; color: #999;
    letter-spacing: 0.02em;
  }
  .v-row:hover { color: var(--accent); background: #0d0d0d; }
  .v-name { flex: 1; }
  .v-bpm { color: #555; font-size: 10px; white-space: nowrap; }
  .v-copy {
    color: #555; font-size: 10px; letter-spacing: 0.1em;
    text-transform: uppercase; white-space: nowrap;
  }
  .v-copy:hover { color: var(--accent); }
  .v-empty { padding: 14px; font-size: 11px; color: #444; font-family: monospace; }
</style>
</head>
<body>

<header>
  <div class="eyebrow" id="eyebrow">Late Blo0om / Suno Studio</div>
  <h1>Suno Prompt<br><em id="h1-em">Generator</em></h1>
  <div style="margin-top:18px"><a href="index.html" style="color:#666;font-family:monospace;font-size:11px;letter-spacing:.15em;text-transform:uppercase;text-decoration:none">&larr; lateblooom.com</a></div>
  <div class="tagline">Two style modes · Tag-dense or production-brief · Suno-ready output</div>
</header>

<main>
  <label>Style Mode</label>
  <div class="mode-grid">
    <button class="mode-btn active-niia" id="btn-niia" onclick="setMode('niia')">
      <div class="m-name">Dr. B's Style</div>
      <div class="m-sub">Comma-delineated · Tag-dense · Production-loaded</div>
      <div class="m-desc">Suno-readable. Stacks descriptors. Heavy on production values.</div>
    </button>
    <button class="mode-btn" id="btn-grey" onclick="setMode('grey')">
      <div class="m-name">Grey's Style</div>
      <div class="m-sub">Production-brief · Paragraph form · Reference-heavy</div>
      <div class="m-desc">Conventional structure. Reads like a producer's notes.</div>
    </button>
  </div>


  <div class="preset-wrap">
    <label>Presets <span>(click to load — stack a voice with a song)</span></label>

    <div class="preset-group">
      <div class="preset-group-label">Voice</div>
      <div class="chips">
        <button type="button" class="chip" onclick="applyPreset('maleGospel',this)">Black Male Powerhouse</button>
        <button type="button" class="chip" onclick="applyPreset('sopranoVirtuoso',this)">Virtuosic Soprano</button>
      </div>
    </div>

    <div class="preset-group">
      <div class="preset-group-label">Song</div>
      <div class="chips">
        <button type="button" class="chip" onclick="applyPreset('gospelShowstopper',this)">Gospel Showstopper</button>
        <button type="button" class="chip" onclick="applyPreset('deepHouse90',this)">90s Deep House</button>
        <button type="button" class="chip" onclick="applyPreset('altRock90',this)">90s Alt Rock Anthem</button>
        <button type="button" class="chip" onclick="applyPreset('maqamSoul',this)">Neo-Soul × Maqam</button>
        <button type="button" class="chip" onclick="applyPreset('celestialDream',this)">Celestial Dream Pop</button>
        <button type="button" class="chip" onclick="applyPreset('bhangra',this)">Bhangra</button>
      </div>
    </div>

    <div class="preset-group">
      <div class="preset-group-label">My Presets</div>
      <div class="chips" id="custom-chips"></div>
      <div class="save-row">
        <input id="preset-name" placeholder="name this preset" onkeydown="if(event.key==='Enter')saveCustomPreset()">
        <button type="button" onclick="saveCustomPreset()">Save current form</button>
      </div>
    </div>
  </div>

  <div class="vault">
    <div class="chips">
      <button type="button" class="chip" id="vault-toggle" onclick="toggleVault()">Vault · <span id="vault-total"></span> prompts</button>
      <button type="button" class="chip" onclick="randomize()">Randomize</button>
    </div>
    <div class="vault-count" id="roll-note" style="margin-top:8px;display:none"></div>
    <div id="vault-body" style="display:none">
      <input id="vault-search" placeholder="search the vault — kizomba, sade, mastering, disco, whisper..." oninput="renderVault()">
      <div class="vault-count" id="vault-count"></div>
      <div class="vault-list" id="vault-list"></div>
    </div>
  </div>

  <div class="field">
    <label>Song Concept / Mood</label>
    <textarea id="concept" rows="3" placeholder="e.g. confession from a dark room that ends up on stadium speakers, mythological undertone"></textarea>
  </div>

  <div class="row field">
    <div>
      <label>Genre / Style Tags</label>
      <input id="genre" placeholder="e.g. dark cinematic pop, neo-soul, 90s deep house">
    </div>
    <div>
      <label>BPM</label>
      <input id="bpm" placeholder="e.g. 95">
    </div>
  </div>

  <div class="field">
    <label>Vocal Direction</label>
    <input id="vocal" placeholder="e.g. female lead, raspy edges, gospel cry on climax, breathy confessional">
  </div>

  <div class="row-13 field">
    <div>
      <label>Language</label>
      <select id="language">
        <option>English</option>
        <option>French</option>
        <option>Spanish</option>
        <option>Portuguese</option>
        <option>Italian</option>
        <option>Multilingual</option>
      </select>
    </div>
    <div>
      <label>Reference Artists</label>
      <input id="references" placeholder="e.g. Rihanna, Nina Simone, Sade">
    </div>
  </div>

  <div class="field">
    <label>Custom Structure <span>(optional · comma-separated sections)</span></label>
    <input id="sections" placeholder="e.g. Intro, Verse, Pre-Chorus, Chorus, Bridge, Final Chorus">
  </div>

  <label class="check-row" id="no808-row">
    <input type="checkbox" id="no808">
    Exclude 808 from production tags (use for acoustic / classical / vintage)
  </label>

  <div class="stack-note" id="stack-note">
    <strong>Auto-included production stack:</strong><br>
    <span id="stack-list"></span>
  </div>

  <button id="generate" onclick="generate()">Generate Prompt</button>

  <div id="output">
    <div class="out-card" id="out-card">
      <div class="out-header">
        <div class="out-label" id="out-mode-label">Dr. B's Style Output</div>
        <button id="copy-btn" onclick="copyOut()">Copy</button>
      </div>
      <div class="out-body" id="out-body"></div>
    </div>
    <div class="footer-note" id="footer-note"></div>
  </div>
</main>

<script>

const PRESETS = {
  maleGospel: {
    kind: "voice",
    vocal: "deep rich baritone Black male lead, church-trained melismatic runs, raw emotional authenticity, gravelly lower register, smooth mixed-voice transitions, crystal-clear head voice, spontaneous ad-libs, soulful vibrato, intimate croon to full-power belt, extended breath control, gospel and R&B tradition with modern vocal acrobatics"
  },
  sopranoVirtuoso: {
    kind: "voice",
    vocal: "virtuosic Black female soprano, second-soprano agility with first-soprano power, microtonal inflections and pitch bending, blue-note bends, coloratura runs, seamless register transitions with no break, breathy whisper to full operatic power, sustained soaring high notes, intricate ornamentation, rich harmonic overtones, vocal texture as storytelling, gospel-rooted runs with classical precision"
  },
  deepHouse90: {
    kind: "song",
    genre: "90s deep house, dance pop",
    bpm: "122",
    concept: "hypnotic repetitive melancholic groove — observing a woman's daily ritual from a distance, mysterious, beautiful, unknowable",
    vocal: "female, airy, half-spoken half-sung, deadpan storytelling, wordless looped melodic chant as the hook",
    sections: "Intro Hook, Verse, Hook, Verse, Hook, Outro Fade",
    extra: "sparse house kick, shimmering hi-hats, minimal bassline, light piano stabs, hooky la-da-dee vocal loop, hypnotic repetition"
  },
  altRock90: {
    kind: "song",
    genre: "90s alternative rock, post-grunge, folk rock",
    bpm: "134",
    concept: "waking up feeling the weight of the world, crying out to the universe for answers, exhausted hope, spiritual yearning",
    vocal: "female, powerful belt, raspy edges, starts restrained and builds to full-throated wail, repeated vocal build escalating into scream-sing release",
    sections: "Verse, Pre-Chorus, Chorus, Verse, Chorus, Bridge Breakdown, Climactic Outro",
    extra: "acoustic guitar driven, electric guitar layers, driving drums entering mid-song, organic live-feeling, no polish, cathartic release through the bridge"
  },
  maqamSoul: {
    kind: "song",
    genre: "neo-soul, Arabic maqam fusion, spiritual R&B",
    bpm: "82",
    concept: "devotional intimate aching sweetness, sacred love — you are my home, my qibla, the direction I turn toward; love as orientation, as prayer, as arrival",
    vocal: "female, warm and smoky, melismatic runs with Arabic-inflected ornamentation, tender not performative, bridge opens into extended mawwal-style improvisation",
    sections: "Verse, Chorus, Verse, Chorus, Mawwal Bridge, Final Chorus",
    extra: "brushed drums, fretless bass, Rhodes electric piano, oud texture woven through, call-and-response between voice and instrument, Maqam Rast or Bayati tonality, raised and lowered microtones, sparse verses with fuller layered chorus"
  },
  celestialDream: {
    kind: "song",
    genre: "ethereal dream pop, cinematic indie pop, celestial art pop",
    bpm: "104",
    concept: "luminous soaring otherworldly tenderness — love as light, not weight; lanterns, crescent moon, light through latticed windows",
    vocal: "female, layered, crystalline, lead clear and forward, harmonies stacked like light refracting, breathy on verses, full and open on chorus, pure tone with no rasp",
    sections: "Verse, Chorus, Verse, Chorus, Stripped Bridge, Final Chorus, Outro",
    extra: "propulsive driving 8th-note pulse under an airy arrangement, shimmering synth pads, harp plucks, distant Arabic melodic fragment in the high register like a remembered call to prayer, reverb-soaked but never muddy, choruses open wide like a ceiling disappearing, outro voices multiply and build upward"
  },
  bhangra: {
    kind: "song",
    genre: "Bhangra, Punjabi folk fusion, celebratory world pop",
    bpm: "140",
    concept: "jubilant communal full-body joy — love as celebration, not a whisper. a wedding, this is joy",
    vocal: "female lead, strong and bright, call-and-response moments, bold vowels, confident delivery, rapid and rhythmically precise on verses, expansive proclamation on chorus",
    sections: "Percussion Intro, Verse, Chorus, Verse, Chorus, Tumbi Bridge, Final Chorus, Outro",
    extra: "dhol drum as heartbeat and spine, tumbi string pluck on the melodic hook, dholak layered underneath, punchy bass, brass stabs on the chorus, handclaps throughout, percussion-forward intro, bridge drops to tumbi and voice before the dhol crashes back in, ends on a peak not a fade"
  },
  gospelShowstopper: {
    kind: "song",
    genre: "contemporary gospel, traditional gospel, gospel anthem",
    bpm: "128",
    concept: "uplifting church showstopper that builds to a roof-raising climax, cathedral atmosphere, testimony energy",
    vocal: "powerful lead with church-trained runs and melismas, full gospel choir in call-and-response, soprano descants, alto and tenor counter-melodies, bass foundation",
    sections: "Intro, Verse, Pre-Chorus, Chorus, Verse, Chorus, Choir Break, Bridge, Key Change, Final Chorus, Vamp",
    extra: "Hammond B3 with drawbar swells, vintage Rhodes bell tones, Fender Telecaster gospel licks, cathedral reverb on vocals, handclaps, tambourine, syncopated gospel groove, organ solo runs, dramatic key change in final chorus, SATB choir arrangement"
  }
};

function applyPreset(key, el) {
  applyPresetObj(PRESETS[key], el);
}

function applyPresetObj(p, el) {
  if (!p) return;
  if (p.vocal) {
    const cur = document.getElementById("vocal").value.trim();
    document.getElementById("vocal").value = (p.kind === "voice" && cur && !cur.includes(p.vocal))
      ? p.vocal : p.vocal;
  }
  if (p.genre)      document.getElementById("genre").value = p.genre;
  if (p.bpm)        document.getElementById("bpm").value = p.bpm;
  if (p.concept)    document.getElementById("concept").value = p.concept;
  if (p.sections)   document.getElementById("sections").value = p.sections;
  if (p.language)   document.getElementById("language").value = p.language;
  if (p.references) document.getElementById("references").value = p.references;
  if (p.extra)    window.__presetExtra = p.extra; else if (p.kind === "song") window.__presetExtra = "";

  // toggle chip state within its own group
  const group = el.parentElement;
  [...group.querySelectorAll(".chip")].forEach(c => c.classList.remove("on"));
  el.classList.add("on");
}

// ---- custom presets (localStorage) ----
const LS_KEY = "sunogen_custom_presets";
let CUSTOM = {};
try { CUSTOM = JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { CUSTOM = {}; }

function persistCustom() {
  localStorage.setItem(LS_KEY, JSON.stringify(CUSTOM));
}

function saveCustomPreset() {
  const nameEl = document.getElementById("preset-name");
  const name = nameEl.value.trim();
  if (!name) { nameEl.focus(); return; }
  const p = { kind: "song" };
  ["genre", "bpm", "concept", "vocal", "sections", "references"].forEach(id => {
    const v = document.getElementById(id).value.trim();
    if (v) p[id] = v;
  });
  const lang = document.getElementById("language").value;
  if (lang && lang !== "English") p.language = lang;
  if (window.__presetExtra) p.extra = window.__presetExtra;
  CUSTOM[name] = p;
  persistCustom();
  nameEl.value = "";
  renderCustomChips();
}

function deleteCustomPreset(name) {
  delete CUSTOM[name];
  persistCustom();
  renderCustomChips();
}

function renderCustomChips() {
  const wrap = document.getElementById("custom-chips");
  wrap.innerHTML = "";
  const names = Object.keys(CUSTOM);
  if (!names.length) {
    const s = document.createElement("span");
    s.className = "no-custom";
    s.textContent = "none yet — fill the form, name it, save";
    wrap.appendChild(s);
    return;
  }
  names.forEach(name => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.appendChild(document.createTextNode(name));
    const x = document.createElement("span");
    x.className = "x";
    x.textContent = "×";
    x.onclick = e => {
      e.stopPropagation();
      if (confirm('Delete preset "' + name + '"?')) deleteCustomPreset(name);
    };
    b.appendChild(x);
    b.onclick = () => applyPresetObj(CUSTOM[name], b);
    wrap.appendChild(b);
  });
}
renderCustomChips();

const PRODUCTION_TAGS = ["binaural","3d","layered harmony","catchy intro","catchy","earworm","anthemic","808","side chain","small room reverb","intimate","whisper vocals","double vocals"];
const MODES = {
  niia: { label: "Dr. B's Style", color: "#00e5ff" },
  grey: { label: "Grey's Style", color: "#c9a063" }
};
let mode = "niia";
let lastCopyText = "";

function refreshStack() {
  const no808 = document.getElementById("no808").checked;
  document.getElementById("stack-list").textContent =
    PRODUCTION_TAGS.filter(t => !(no808 && t === "808")).join(", ");
}
document.getElementById("no808").addEventListener("change", refreshStack);
refreshStack();

function setMode(m) {
  mode = m;
  const c = MODES[m].color;
  document.documentElement.style.setProperty("--accent", c);
  document.getElementById("btn-niia").className = "mode-btn" + (m === "niia" ? " active-niia" : "");
  document.getElementById("btn-grey").className = "mode-btn" + (m === "grey" ? " active-grey" : "");
  document.getElementById("no808-row").style.display = m === "niia" ? "flex" : "none";
  document.getElementById("stack-note").style.display = m === "niia" ? "block" : "none";
  document.getElementById("output").style.display = "none";
}

function val(id) { return document.getElementById(id).value.trim(); }

function generate() {
  const concept = val("concept"), genre = val("genre"), vocal = val("vocal"),
        bpm = val("bpm"), language = val("language"), references = val("references"),
        sections = val("sections"), no808 = document.getElementById("no808").checked;

  if (!concept && !genre) return;

  const body = document.getElementById("out-body");
  document.getElementById("out-mode-label").textContent = MODES[mode].label + " Output";
  document.getElementById("out-card").style.borderColor = MODES[mode].color + "33";

  if (mode === "niia") {
    const tags = [];
    if (genre) tags.push(...genre.split(",").map(t => t.trim()).filter(Boolean));
    if (vocal) tags.push(...vocal.split(",").map(t => t.trim()).filter(Boolean));
    if (language && language.toLowerCase() !== "english") tags.push(language + " vocals");
    if (bpm) tags.push(bpm + " BPM");
    if (window.__presetExtra) tags.push(...window.__presetExtra.split(",").map(t => t.trim()).filter(Boolean));
    tags.push(...PRODUCTION_TAGS.filter(t => !(no808 && t === "808")));
    if (references) tags.push(...references.split(",").map(t => t.trim() + " influence").filter(Boolean));
    if (concept) tags.push(concept);
    const seenTags = new Set();
    const styleBox = tags.filter(t => {
      const k = t.toLowerCase();
      if (seenTags.has(k)) return false;
      seenTags.add(k); return true;
    }).join(", ");
    const structure = sections
      ? sections.split(",").map(s => "[" + s.trim() + "]").join(" → ")
      : "[Intro] → [Verse] → [Pre-Chorus] → [Chorus] → [Verse] → [Chorus] → [Bridge] → [Outro]";
    lastCopyText = styleBox;
    body.innerHTML =
      '<div class="out-section-label">Style Box · Paste into Suno</div>' +
      '<div class="out-box">' + esc(styleBox) + '</div>' +
      '<div class="out-section-label">Structure</div>' +
      '<div class="out-box structure">' + esc(structure) + '</div>';
  } else {
    const parts = [];
    if (genre) parts.push("Style: " + genre);
    if (concept) parts.push("Mood / Concept: " + concept);
    if (vocal) parts.push("Vocal Direction: " + vocal);
    if (bpm) parts.push("Tempo: " + bpm + " BPM");
    if (language) parts.push("Language: " + language);
    if (references) parts.push("Reference Artists: " + references);
    if (window.__presetExtra) parts.push("Instrumentation & Production: " + window.__presetExtra);
    const structure = sections
      ? sections.split(",").map(s => s.trim()).join(" → ")
      : "Intro → Verse → Pre-Chorus → Chorus → Verse → Chorus → Bridge → Final Chorus";
    parts.push("Song Structure: " + structure);
    const full = parts.join("\n\n");
    lastCopyText = full;
    body.innerHTML = '<div class="out-box brief">' + esc(full) + '</div>';
  }

  document.getElementById("footer-note").textContent =
    "Catalog: Pharoah Phoenix LLC · Late Blo0om · " + (language || "English") + " · " + (bpm ? bpm + " BPM" : "no BPM set");
  document.getElementById("output").style.display = "block";
  document.getElementById("copy-btn").textContent = "Copy";
  document.getElementById("copy-btn").classList.remove("copied");
  document.getElementById("output").scrollIntoView({ behavior: "smooth", block: "start" });
}

function copyOut() {
  navigator.clipboard.writeText(lastCopyText).then(() => {
    const b = document.getElementById("copy-btn");
    b.textContent = "Copied ✓"; b.classList.add("copied");
    setTimeout(() => { b.textContent = "Copy"; b.classList.remove("copied"); }, 2000);
  });
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const VAULT_CATS = [
  ["foundation", "Foundation Layers"],
  ["voice", "Vocal Palettes"],
  ["genre", "Genres & Songs"],
  ["combo", "Complete Combos"],
  ["classic", "Classic Production Styles"],
  ["mastering", "Mastering Templates"],
  ["reference", "Iconic References"],
  ["mood", "Moods & Atmosphere"],
  ["instruments", "Rare Instruments"],
  ["structure", "Structure Templates (copy only)"]
];

function toggleVault() {
  const b = document.getElementById("vault-body");
  const open = b.style.display === "none";
  b.style.display = open ? "block" : "none";
  if (open) { renderVault(); document.getElementById("vault-search").focus(); }
}

function vaultApply(i) {
  const e = VAULT[i];
  if (e.c === "structure") { vaultCopy(i); return; }
  if (e.c === "voice") document.getElementById("vocal").value = e.t;
  else document.getElementById("genre").value = e.t;
  if (e.b) document.getElementById("bpm").value = e.b;
}

function vaultCopy(i, el) {
  navigator.clipboard.writeText(VAULT[i].t).then(() => {
    if (!el) return;
    const old = el.textContent;
    el.textContent = "copied";
    setTimeout(() => { el.textContent = old; }, 1200);
  });
}

function renderVault() {
  const q = document.getElementById("vault-search").value.trim().toLowerCase();
  const list = document.getElementById("vault-list");
  list.innerHTML = "";
  let shown = 0;
  VAULT_CATS.forEach(([cat, label]) => {
    const items = VAULT.map((e, i) => [e, i])
      .filter(([e]) => e.c === cat)
      .filter(([e]) => !q || (e.n + " " + e.c + " " + e.t).toLowerCase().includes(q));
    if (!items.length) return;
    const h = document.createElement("div");
    h.className = "v-cat"; h.textContent = label;
    list.appendChild(h);
    items.forEach(([e, i]) => {
      shown++;
      const row = document.createElement("div");
      row.className = "v-row";
      const name = document.createElement("span");
      name.className = "v-name"; name.textContent = e.n;
      const bpm = document.createElement("span");
      bpm.className = "v-bpm"; bpm.textContent = e.b ? e.b + " BPM" : "";
      const cp = document.createElement("span");
      cp.className = "v-copy"; cp.textContent = "copy";
      cp.onclick = ev => { ev.stopPropagation(); vaultCopy(i, cp); };
      row.appendChild(name); row.appendChild(bpm); row.appendChild(cp);
      row.onclick = () => vaultApply(i);
      list.appendChild(row);
    });
  });
  if (!shown) {
    const d = document.createElement("div");
    d.className = "v-empty"; d.textContent = "nothing matches — try fewer letters";
    list.appendChild(d);
  }
  document.getElementById("vault-count").textContent =
    shown + " of " + VAULT.length + " · click to load into form · structure templates copy to clipboard";
}

function randomize() {
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const genres = VAULT.filter(e => e.c === "genre" || e.c === "classic" || e.c === "combo");
  const voices = VAULT.filter(e => e.c === "voice");
  const moods  = VAULT.filter(e => e.c === "mood");
  if (!genres.length || !voices.length) return;
  const g = pick(genres), v = pick(voices), m = moods.length ? pick(moods) : null;
  document.getElementById("genre").value = g.t;
  document.getElementById("vocal").value = v.t;
  if (g.b) document.getElementById("bpm").value = g.b;
  if (m) window.__presetExtra = m.t;
  const note = document.getElementById("roll-note");
  note.style.display = "block";
  note.textContent = "rolled: " + g.n + " × " + v.n + (m ? " × " + m.n : "");
}

document.getElementById("vault-total").textContent = VAULT.length;
