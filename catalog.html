<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L8 BLO0M — Lyrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Playfair+Display:wght@400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--el:#08081a;--tx:#eef0ff;--dim:#7a8199;--fnt:#3a3f4f;--e:#00d9ff;--p:#b366ff;--l:#14142a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'Cormorant Garamond',Georgia,serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.c{max-width:740px;margin:0 auto;padding:28px 16px 60px}
.h{text-align:center;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--l)}
.h h1{font-family:'Playfair Display',serif;font-weight:400;font-size:28px;letter-spacing:.2em;background:linear-gradient(90deg,var(--e),var(--p));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:4px}
.h .tg{font-style:italic;color:var(--dim);font-size:12px}
.back{display:inline-block;margin-bottom:16px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);text-decoration:none;border:1px solid var(--l);padding:4px 12px;border-radius:100px;transition:all .15s}
.back:hover{color:var(--e);border-color:var(--e)}
.f{display:flex;gap:6px;justify-content:center;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.fl{font-size:9px;text-transform:uppercase;letter-spacing:.25em;color:var(--fnt);font-family:'JetBrains Mono',monospace;margin-right:4px}
.ch{background:transparent;border:1px solid var(--l);color:var(--dim);padding:3px 10px;border-radius:100px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.15em;transition:all .15s}
.ch:hover{color:var(--tx);border-color:var(--e)}
.ch.a{background:var(--e);border-color:var(--e);color:var(--bg)}
.ct{text-align:center;margin-bottom:16px;font-size:13px;color:var(--e);letter-spacing:.35em;font-family:'Playfair Display',serif}
.s{border-top:1px solid var(--l);transition:background .15s}
.s:last-child{border-bottom:1px solid var(--l)}
.s.x{display:none}
.s:hover{background:rgba(0,217,255,.04)}
.s.o{background:var(--el)}
.sh{padding:5px 8px;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:10px;user-select:none}
.st{font-family:'Playfair Display',serif;font-size:15px;font-weight:400}
.s.o .st{color:var(--e)}
.sm{font-family:'JetBrains Mono',monospace;font-size:8px;text-transform:uppercase;letter-spacing:.2em;color:var(--fnt);white-space:nowrap;flex-shrink:0}
.sb{padding:0 12px 14px;display:none}
.s.o .sb{display:block;padding-top:4px}
.sec-h{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.22em;color:var(--p);margin:14px 0 4px;display:block}
.sec-h:first-child{margin-top:8px}
.sec-n{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--dim);font-style:italic;display:block;margin:4px 0 10px}
.sec-l{font-size:15px;line-height:1.6;color:var(--tx);white-space:pre-wrap;display:block;margin-bottom:4px}
.loading{text-align:center;color:var(--dim);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;padding:40px 0}
.ft{text-align:center;margin-top:32px;padding-top:12px;border-top:1px solid var(--l);color:var(--fnt);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase}
@media(max-width:640px){.sh{padding:5px 4px}.st{font-size:14px}.sb{padding:0 4px 12px}.sec-l{font-size:14px}}
</style>
</head>
<body>
<div class="c">
  <a href="index.html" class="back">← Back to L8 Blo0om</a>
  <div class="h"><h1>L8 BLO0M</h1><div class="tg">— lyrics —</div></div>
  <div class="f">
    <span class="fl">Language</span>
    <button class="ch a" data-v="all">All</button>
    <button class="ch" data-v="english">English</button>
    <button class="ch" data-v="french">French</button>
    <button class="ch" data-v="spanish">Spanish</button>
    <button class="ch" data-v="portuguese">Portuguese</button>
  </div>
  <div class="ct" id="ct">…</div>
  <div id="sx"><div class="loading">loading lyrics…</div></div>
  <div class="ft">L8 BLO0M · lyrics · 🌺</div>
</div>
<script>
const langLabel={english:'EN',french:'FR',spanish:'ES',portuguese:'PT',multilang:'MULTI'};
const sx=document.getElementById('sx'),ct=document.getElementById('ct');
let cf='all';

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

function renderSong(s){
  const body=s.sections.map(sec=>{
    if(sec[0]==='h') return `<span class="sec-h">${esc(sec[1])}</span>`;
    if(sec[0]==='n') return `<span class="sec-n">${esc(sec[1])}</span>`;
    return `<span class="sec-l">${esc(sec[1])}</span>`;
  }).join('');
  const a=document.createElement('article');
  a.className='s';
  a.dataset.lang=s.lang||'english';
  a.innerHTML=`<div class="sh"><div class="st">${esc(s.title)}</div><div class="sm">${langLabel[s.lang]||'EN'} · ${esc(s.gender||'F')}</div></div><div class="sb">${body}</div>`;
  return a;
}

function apply(){
  let n=0;
  document.querySelectorAll('.s').forEach(el=>{
    const show=cf==='all'||el.dataset.lang===cf;
    el.classList.toggle('x',!show);
    if(show)n++;
  });
  ct.textContent=n===1?'1 song':n+' songs';
}

document.querySelectorAll('.ch').forEach(c=>c.addEventListener('click',()=>{
  document.querySelectorAll('.ch').forEach(x=>x.classList.remove('a'));
  c.classList.add('a');
  cf=c.dataset.v;
  apply();
}));

document.addEventListener('click',e=>{
  const h=e.target.closest('.sh');
  if(h)h.parentElement.classList.toggle('o');
});

fetch('songs.json')
  .then(r=>r.json())
  .then(data=>{
    const songs=(data.songs||data).slice().sort((a,b)=>a.title.localeCompare(b.title,undefined,{sensitivity:'base'}));
    sx.innerHTML='';
    songs.forEach(s=>sx.appendChild(renderSong(s)));
    apply();
  })
  .catch(()=>{
    sx.innerHTML='<div class="loading">could not load lyrics</div>';
    ct.textContent='';
  });
</script>
</body>
</html>
