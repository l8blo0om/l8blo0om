{t:"All I Ever Wanted",g:"F",l:"english",b:"[Verse 1]\nAll I ever wanted was to do a little better than the next man\nDo the best that I can elevate the plan, you know\n\n[Verse 2]\nAnd all I ever wanted was to have more than dimes in my pocket\nWhen I try to rock it, I gotta have that dough\nYou know\n\n[Pre-Chorus]\nYou gotta be better, baby\nGotta be clever, baby\nGotta have it all together, baby, if you wanna get there\n\n[Chorus]\nYou gotta be better, baby\nYou gotta be clever, baby\nGotta have it all together, baby, if you wanna get there\n\n[Verse 3]\nI thought it might be nice to find a love to fall in like the poets, boy\nThey really know it when their hearts trip there, you know\n\n[Verse 4]\nI thought it might be nice if I could make a better world for my mother\nBoy, I really love her\nShe's always been right there\n\n[Chorus]\nGotta be better, baby\nGotta be clever, baby\nGotta have it all together, baby, if you wanna get there\n\n[Bridge]\n(Ain't easy, ain't easy, ain't easy, but it's nice to be real)\n(Ain't easy, ain't easy, ain't easy, but it's good to be here)\n\n[Verse 5]\nAll I ever wanted was to set a golden standard for the next man\nDo the best that I can to elevate the plan\n\n[Verse 6]\nAnd all I ever wanted was to have more than hearts in my pocket\nWhen love blooms is rocking, I gotta step that flow\nSwitch the flow\n\n[Outro — vocal scat, guitar duet]"},
{t:"Brick by Brick",g:"F",l:"english",b:"[Verse 1]\nFirst date, first glance, first chance to decide if we're building a porch or a fence\nA question ain't a courtroom, baby, it's a doorway, but every doorway depends\nOn whether curiosity carries the lumber or whether defensiveness carries the cement\nFunny how a tiny little brick can reveal what the architect never meant\n\nYou call it moving forward, I call it measuring angles before the foundation gets bent\nI don't study every detail because I'm doubtful, I study details because they're evidence\nEvery promise is a brick, every silence is a brick, every answer leaves a fingerprint\nAnd every house tells the truth eventually, even if the blueprints never did\n\n[Chorus]\nBrick by brick, we can get to know each other\nBrick by brick, we can build a wall\nBrick by brick, we can build a little heaven\nFunny thing about little things, baby, little things become it all\n\n[Post Chorus]\nBrick by brick… Brick by brick…\nLittle things become it all… Little things become it all…\n\n[Verse 2]\nSome folks stack their questions in the corner like boxes they never intend to unpack\nSome folks throw a rug over the rough spots and pray the floor don't answer back\nBut every buried bump grows taller underneath you every time you cross the track\nTill you're stumbling over yesterday wondering where tomorrow went off track\n\nI don't wanna fight a wall twenty years from now that started life as a pebble in a crack\nI'd rather sit beside you in the dust and say, \"Hey baby, what do you make of that?\"\nBecause a brick ain't dangerous by itself, it's repetition that gives it weight and mass\nAnd a thousand tiny moments become a fortress before anybody asks\n\n[Bridge]\nEvery laugh is a brick. Every truth is a brick.\nEvery tear is a brick. Every fear is a brick.\nEvery time we stay curious instead of certain, another brick finds the right place.\n\n[Final Chorus]\nBrick by brick, we can get to know each other\nBrick by brick, we can build a wall\nBrick by brick, we can build a little heaven\nFunny thing about little things, baby…\nLittle things become it all."},
{t:"Business Hours",g:"F",l:"english",b:"[Verse 1]\nAin't no rooster crowed, ain't no coffee brewed,\nSun's still hidin' in the navy blue.\nI don't turn my ringer off — I got kids, I got my mama, too,\nSo if that buzz lights up my screen, it better be worth what it's puttin' me through.\n\n[Pre-Chorus]\n'Cause the first thought in the morning's precious real estate,\nThat's for the one I'm dreamin' of, not some \"hey, you awake?\"\n\n[Chorus]\nBusiness hours start 'round eight-thirty-nine,\nSo don't come knockin' in my peace of mind.\nIf you ain't layin' here, hearin' my heartbeat,\nYou don't get the right to break my sleep.\nDon't roll over in your bed from miles away,\nAnd think you can whisper in my ear at break o' day —\nSave it for the sun, my friend,\nLet me rest 'til business hours begin.\n\n[Verse 2]\nIf you ain't the one my mind is on when my eyes first open wide,\nYou're cutting the line thinking no one minds\nAnd \"B.C.S\" at six A.M. is cute, but let's be real —\nYou just disturbed the rest you claim you wanna help me feel.\n\n[Pre-Chorus]\nYeah, my beauty sleep's a boundary, not a casual suggestion,\nYou ring my bell too early, you gonna learn a lesson:\n\n[Bridge]\nMy mornings are mine, my silence is gold,\nRespect the space where my dreams unfold.\nNo knock, no buzz, no early call,\nThat's the rule, that's the law, that's all."},
{t:"C'est inconvenant…",g:"M",l:"french",b:"[Intro – murmuré, presque amusé]\nC'est inconvenant. Ça n'a aucun sens. Tout est mal placé depuis ton entrée dans ma vie.\n\n[Couplet]\nJ'avais des plans précis, des cases propres, des règles tranquilles alignées dans ma tête.\nL'amour ici. Le désir là-bas. Le futur sous verre. Le passé sous clé.\nPuis toi… toi avec ton rire lent, tes regards dangereux, tes silences trop longs qui déplacent les meubles dans mon esprit.\n\n[Pré-refrain]\nCe n'était pas prévu. Pas logique. Pas pratique. Pas raisonnable.\nEt pourtant...\n\n[Refrain]\nEt pourtant... ma main retrouve toujours le milieu de ton dos.\nEt pourtant... je connais déjà la courbe de ton souffle dans l'obscurité.\nEt pourtant... quand tu me regardes tout mon système cesse d'obéir.\nC'est absurde. C'est inconvenant. Et c'est presque parfait.\n\n[Couplet]\nLes choses tombent des étagères. Les mots sortent des tiroirs. Les rôles glissent de leurs noms.\nJe te voulais passagère. Je te voulais légère. Je te voulais simple comme une chanson d'été.\nMais tu reviens comme reviennent les marées, avec cette façon calme de défaire mes certitudes.\n\n[Pont – tango plus intense]\nUn. Deux. Tourne.\nJe mène. Tu corriges. Je résiste. Tu souris.\nLa catastrophe devient chorégraphie.\n\n[Dernier refrain]\nEt pourtant... dans le désordre magnifique de nos mauvais timings, dans les départs ridicules, dans les retours impossibles, dans les nuits qui débordent de choses qu'on ne devrait pas sentir...\nil existe parfois une seconde suspendue où tout s'aligne enfin.\nEt là... là j'ai peur du mot parfait."},
{t:"Come",g:"F",l:"english",b:"Come… Come… Come…\nwhere mossy rocks and twilight call for an azure sky to rise.\n\nEarth, thick rich-like darkness curdling in a dark dark room.\n\nCome… Come… Come…\nwhere colors run from the earth to cool green leaves\nwhere rivers dance around fires\nwhen the night's voice is a hoarse whisper.\n\nScreaming coldness\nlong legged long torsoed long haired nudity\n\nCome… Come… Come…\nwhere deep deep deep brown shadows fall beside brown skinfeatures.\n\nPearl eyes gleam from within as night is kissed by soft, moist brown lips.\n\nCome… Come… Come… where dead of night is alive.\n\nCome… Come… Come… Where people are rooted to the earth with SINEWS\n\nCome… Come… Come…\nwhere milk drips from tapped trees and the mountains sip your blood.\n\ncome."},
{t:"Comme ça",g:"F",l:"french",b:"[Intro — spoken] tu te souviens? Parce que moi, je me souviens…. [sighs]\n\n[Verse]\nNous nous rencontrons dans le royaume magique du corps et de l'esprit,\nProtégée et enseignant, muse et artiste\nComme Camille Claudel et Auguste Rodin\nPiégé dans un salon de folie, d'obsession, compétition, et séduction.\n\nJe veux juste savoir comment tu l'aimes, comme ça, comme ça, comme ça\nApprends-moi comment le faire, Comme ça, comme ça, comme ça\n\nLorsque l'étudiant est prêt, l'enseignante apparaît\n\nParfois, nous flottons en noir et blanc, Comme une bobine de film\nQui scintille profondément dans la nuit.\nEt nous sommes sur un bateau pour Monaco, Le matin après qu'on a joué à Nice.\nL'une - Jane Birkin, L'Autre - Serge Gainsbourg,\nChemises rayées, sourires et vin rouge uh\n\n[Bridge]\nParfois, nos pensées sont de la fièvre,\nDes pages désordonnées dégoulinant d'encre,\nAnaïs Nin en promettant à Henry Miller qu'elle financerait son rêve\nS'il lui ferait son seul rêve\nUn rêve lucide, affamé et mouillé\nDes journaux incendiés,\n\nIl paraît que Je te nourris par mon brillance, tu me nourris par ton désir.\n\n[Chuchoté] floraison tardive. Jamais trop tard."},
{t:"Coyote",g:"F",l:"english",b:"[or why I crossed the road — This is for Late Bloom. It's never too late—]\n\n[Verse 1]\nI ought to be used to this by now\nThe \"might as well give up\" suffocation\nThe finger pointing relay\nThe \"well you're the one who's…\" Time bomb. The tears\n\nI can listen to the same break up playlist\nAnd feel the same helplessness\nNow with him, instead of him\nAnd myself, mostly\n\nI should really have a routine by now\nA little rehearsed skit about lost loves\nAbout how it takes more love to let go than to hold on\nAbout how much we learned. Thank you. And goodbye\n\nBut each time is like getting hit by a Mack truck\nLike the Coyote in the cartoons\nFirst by a red truck, then by a green one\nOver and over\nLooking one way and then, BAM! Fucked. By another one\n\n[Chorus]\nOver and over again. Until it's kind of funny. Like the cartoons. Comic.\n\n[Verse 2]\nHe blinks at the sun, ears ringing, dust settling.\nBrushes gravel from his cheek, nudges his snout back into place.\nCoughs, tastes the desert. Shakes his head — never again.\nThen a rustle of feathers, a flash of blue and gold.\nSomething stirs — hunger? mischief?\nBefore the thought has a name, he's already running.\n\n[Bridge]\nAnd maybe it's always been like this — stories that never explain themselves.\nThe coyote and the bird.\nThe vows we make at twenty, thirty, forty, as if we could map the rest of our lives\nin matching lines and parallel change.\nWe call it happily ever after.\nBut it's a coin toss at best, a myth we keep retelling.\n\n[Chorus]\nOver and over again. Until it's kind of funny. Like the cartoons. Comic."},
{t:"Depois",g:"F",l:"portuguese",b:"[Não me casei]\n\nNão me casei com o cara que atravessou a ponte do Brooklyn de bicicleta até meu escritório na Penn Station, um buquê de rosas cor-de-rosa na mão direita suada, o coração na esquerda.\n\nE depois… e depois… e depois… Mmmmmm\n\nNem com o homem que esperava no aeroporto pra me buscar ou me deixar, e depois ia pro carro e chorava.\n\nE depois… e depois… e depois… Mmmmmm\n\nNão escolhi o homem que fazia massagem nas minhas costas na frente da lareira, óleo quente, vinho\ne depois… e depois… e depois… Mmmmmm\n\nAquele com a casa em Cape Cod onde a gente transava em qualquer lugar que nossos corpos jovens conseguissem se encontrar. No quatro de julho, o Tio Al disparou o canhão de mentira, comemos espiga de milho, saímos no barco, transamos no barco, assistimos os fogos estourarem o céu da noite.\n\nE depois… e depois… e depois… e… É, é, é, é…\n\nNão me casei com o cara que me ajudava a tirar as ervas daninhas do jardim enquanto eu olhava pra ele pela janela do chuveiro, eu e Seema dentro, ele, no nosso olhar, banhado de sol. Fazia jantares vegetarianos pra ele e a gente conversava sobre espiritualidade na varanda dos fundos.\n\nE depois… e depois… e depois… Mmmmmm\n\nNão me casei com o homem que me fazia corar, vermelho escuro e vermelho vivo no mesmo rosto, quando ele abria a mão trêmula e declarava, simples e violentamente, seu desejo por mim, me convidando pra entrar numa vida já cheia demais— esposa, ex-esposa, filhos e um conflito de interesse complicado ainda mais pelo interesse em mim.\n\nE depois… e depois… e depois… Mmmmmm\n\nO cara que me levava aos restaurantes de Les Halles que eu costumava passar, antes de te conhecer, com inveja do luxo de jantar sem pressa.\n\nO amante com quem jantei num terraço com vista pras montanhas ao pôr do sol em Chapada Diamantina, na Bahia. Ele me conquistou numa noite de forró durante o São João, quando os quentões lavaram minhas inibições em doçura líquida.\n\nE depois… e depois… e depois… Mmmmmm\n\nNenhum dos brutos atléticos que eu assistia da lateral do campo, aqueles corpos lindos, machucados, animalescos que eu acariciava com mãos suaves\ne depois… e depois… e depois… Mmmmmm\n\nNenhum dos poetas, os bardos bastardos da caneta ou do cassete.\n\n[Outro]\nMe casei com você.\nGraças a Deus esperei pelo que eu realmente queria."},

{t:"Don't Believe the Weatherman",g:"F",l:"english",b:"[Verse 1]\nHey baby boy,\nWhen I was out in town today, I got us a balloon.\nThough the rain keeps coming down, and a clear blue day may not be hours anytime soon,\n\n[Pre-Chorus]\nI know that things are not the way they seem.\nSo turn the t.v. off and come sit next to me and hold my hand… and we'll dream…\n\n[Chorus]\nDon't believe the weatherman 'cause he don't believe in you and me.\nHe just wants to bring us down with his rainy day mentality.\nDon't believe the weatherman 'cause he don't believe in you and me.\nHe's lost his sense of wonder, All love comes with thunder.\n\n[Verse 2]\nI couldn't pass it up-- no no no when I saw it,\n[beat] 'cause it's the color of your eyes\nWhen the rain, rain won't go away ... and all the words you've tried to say are trying to say goodbye.\nBut the sun'll come out tomorrow (oooooooh yes)\n\n[Pre-Chorus]\nand we can fill it with our love and let it fly.\nIt'll rise above the treetops, nudging all the streetlights,\nwhile we just sit and watch it take to the sky…\n\n[Bridge]\nThough strong winds may blow (oh oh oh) and the billows may roll,\noh, the storm (Storm) will pass (pass) after 'while… so smile.\n\n[Verse 3]\n[beat] And we'll wait for our day, yeah yeah [beat] a lazy day\nWhere your yawns at dawn say you want to play a while\nthough the grass is still damp with dew, The kind of day I want to spend with you and only you.\n\n[Final Chorus]\nDon't believe the weatherman 'cause he don't believe in you and me.\nHe just wants to bring us down with his rainy day mentality.\nDon't believe the weatherman 'cause he don't believe in you and me.\nHe don't know what our love can weather. We'll make sunshine inside together\n\n[Outro]\nLate bloom. It's never too late… Late bloom. It's never too late…"},

{t:"Homme noir",g:"F",l:"french",b:"[Refrain]\nHomme noir, ne laisse jamais briser ton esprit\nni voler ta fierté\nTu es fort et sans peur\nfort et sans défaut\nfort et sans père\nfort et irréprochable\nIls paieront pour le mal qu'ils ont fait dans vos vies\n\n[Couplet 1]\nN'entends-tu pas les tambours battre quand tu marches ?\nEntends-tu le cri des ancêtres résonner dans ta voix ?\nNe vois-tu pas que tes dents sont faites de diamants,\ntes yeux d'onyx, ta peau de laiton poli ?\n\n[Couplet 2]\nN'entends-tu pas les tambours des ancêtres,\nle rythme de la vie résonner dans tes pas quand tu passes ?\nAs-tu oublié ta grandeur— Tout ce que tu as été, et tout ce que tu peux être ?\nTes yeux contiennent les mystères des âges,\nles mensonges du soleil, la vérité de la mer\nPeut-être que c'est perdu. Peut-être que tu ne t'en souviens plus\n\n[Couplet 3]\nEt maintenant, le ghetto est ton royaume\nTon arme est ton sceptre\nNon, enfant, non, enfant, non—\nTa langue est ton épée\nTes ancêtres sont ta protection\nTon destin est grand ouvert"},

{t:"Jeu Acrostique",g:"F",l:"french",b:"[Couplet 1]\nHé — je sais bien que t'es presque un enfant\nAlors regarde, j'ai fait quelque chose d'amusant\nJ'ai pris ton nom et je l'ai caché dans le refrain\nÀ toi de le trouver, allez, cherche bien\nLes enfants aiment jouer, deviner\nDONC, Trouve ton nom caché dans ce couplet\n\n[Refrain — Acrostiche : Moisès]\nEMe — Muéstrame lo que tienes\nO — Olvida las otras mujeres\nI — Iluminas el cuarto con sólo llegar\nEse— Siempre me ves, incluso sin mirar\nÈ — Ères calma, aunque no lo sepas\nESE — Sigue siendo tú — eso siempre me afecta\n\n[Couplet 2]\nVoilà, tu vois ce que j'ai fait\nC'était pas difficile, je n'ai pas même essayé\nC'est dingue, non ? Juste pour jouer\nMais mon jeu préféré, Est avec ta bite dans ma bouche, Quand tu es tout près\n\n[Couplet 3]\nViens avec ton corps sportif\nApporte des préservatifs\nOn peut jouer toute la journée. Toute la nuit. Jusqu'à je crie…\n\n[Outro] Late bloom. It's never too late… to come over, monsieur Castillo ...."},
{t:"Le contraire de l'amour…",g:"M",l:"french",b:"Le contraire de l'amour... ce n'est pas la haine. C'est la peur.\n\nUn pas sur ton pied, c'est une gifle devant témoins.\nLe tango pardonne le sang, jamais l'hésitation.\n\nTa main dans mon dos me donne des ordres silencieux. Je les déteste. Je les suis quand même.\n\nUn. Deux. Attends.\n\nEst-ce ton regard qui guide mes épaules ? Ou le bruit de ton chewing-gum qui mâche le rythme entre tes lèvres lentes ?\n\nTac. Souffle. Tac. Encore.\n\nTu me suis trop bien. Ça me rend dangereux.\n\nL'amour dilate. La peur contracte.\nAlors je serre plus fort.\n\nLe parquet tremble sous nos petites guerres magnifiques. Je mène la danse mais seulement parce que tu acceptes de tomber avec moi.\n\nLa vapeur couvre les miroirs. Je trace une ligne dans la buée juste assez grande pour retrouver tes yeux.\n\nEt là... là je comprends le problème.\nTu me vois même quand j'essaie de devenir brouillard.\n\nAlors tu ris, main plus basse sur le verre, provocation légère pour sauver ma fierté.\n\nUn-deux-trois. Un-deux-trois. Tourne encore.\n\nJe pars toujours avant la dernière note. Puis je reviens comme reviennent les incendies dans les étés trop secs.\n\nCalme dehors. Panique dessous.\n\nEt ton nom... ton nom tourne dans ma poitrine comme un couteau élégant que je n'ai jamais réussi à retirer doucement."},
{t:"Le Flot",g:"F",l:"french",b:"[Floraison tardive — il n'est jamais trop tard.]\n\n[Couplet 1]\nBienvenue chez toi, bébé. Ta journée s'est bien passée ?\nLaisse-moi t'aimer avant même que tu dises un mot.\nTon assiette est froide mais moi je suis chaude, prête.\nViens goûter tant que l'ambiance est parfaite.\nSois prêt, mon cœur, je sais que t'en as envie.\nDéshabille-toi et allonge-toi sur la table.\nCe que j'ai prévu va te faire fondre, alors dis pas non,\ntu sais qu'il faut juste suivre le flot.\n\n[Refrain]\nOui tu dois, oui oui tu dois, tu dois suivre le flot — woah woah\n(x4)\n\n[Couplet 2]\nCrie mon nom si tu veux, bébé j'm'en fous.\nJ'adore la tête que tu fais quand je te touche là-dessous.\nLèche tes lèvres et goûte mon chocolat — tu verras, ça plane comme du ganja.\nMaintenant laisse-moi changer de rôle, grimper sur toi,\nsi tu t'arrêtes pas, moi non plus j'arrête pas.\nLes filles disent souvent d'aller doucement, mais parfois faut juste suivre le courant.\n\n[Pont]\nFais-moi bouger, fais-moi vibrer jusqu'à ce que je sois comblée.\nFais-moi danser, fais-moi frémir jusqu'à ce que je sois comblée.\n\n[Couplet 3]\nT'es un mec bien freaky, mais pas pour présenter à ma mère.\nMais quand tu danses avec Niki, tu sais quoi faire.\nT'es pas mon amour, t'es juste mon amant.\nAlors viens pas faire genre t'as une chance.\nTu sais très bien que mon gars ne comprendrait jamais.\nEt si tu l'savais pas — maintenant tu sais, ho.\nFaut que tu suives le courant."},
{t:"Lo que haría por tu cuerpo",g:"F",l:"spanish",b:"[Intro]\nDicen que todos los caminos llevan a Roma…\nPero tú te pierdes hasta con las instrucciones.\n\n[Verso 1]\nTe veo cruzando la sala despacito\ncomo quien sabe que provoca delitos\nToda la noche jugando al favorito\ny yo mirándote desde el infinito\n\nHay algo en ti que me llama y me reta\ncomo una puerta entreabierta y secreta\nMe acerco lento, sonrisa incompleta\nporque la historia se pone interesante\n\nNo es la primera vez que veo ese fuego\nni la primera vez que escucho ese ego\nMuchos llegan creyéndose leyendas\ny salen siendo apenas un recuerdo\n\n[Pre-Coro]\nY voy, voy, voy siguiendo la música de tu piel\nY voy, voy, voy aunque no sepas todavía leer\n\n[Coro]\nLo que haría por tu cuerpo\nsi supieras lo que sé\nsi aprendieras los secretos\nque la noche quiere ver\n\nLo que haría por tu cuerpo\nsi dejaras de correr\nporque el mapa está en tus manos\npero no sabes qué hacer\n\n[Verso 2]\nNo te confundas, corazón\nHe pasado más tiempo pensándote que teniéndote cerca\n\nTienes las coordenadas exactas\nlas herramientas adecuadas\nla brújula, la ruta marcada\ny sigues perdiéndote en la entrada\n\nSí, estás bueno, voy a admitirlo\npero eso no basta para escribirlo\nHay hombres que encuentran la puerta\ny nunca descubren cómo abrirlo\n\n[Blueprint]\nYou get a boot print. 'Cause I'm the blueprint\nForget what you knew before or what you knew since\n\nTengo la llave, la calle, el instinto\ntú tienes el mapa pero pierdes el ritmo\nTienes el barco, el viento, el equipo\npero llegas al puerto sin saber el motivo\n\n[Pre-Coro]\nYo no vine a perseguirte\nvine a ver si sobrevivías\nPorque un cuerpo puede encenderse\nPero otra cosa es la alquimia\n\n[Puente]\nMás lento… No es cuestión de fuerza\nMás lento… No es cuestión de tamaño\nMás lento… No es cuestión de llegar primero\n\nEs saber leer el lenguaje cuando otro cuerpo te está hablando\n\n[Breakdown]\nHay quienes buscan tesoros. Y hay quienes son el tesoro\nHay quienes siguen señales. Y hay quienes escriben el camino\nYo no sigo estrellas. Las estrellas me siguen\n\n[Coro Final]\nLo que haría por tu cuerpo\nni lo puedo calcular\nporque algunos tienen fuego\ny otros saben cómo quemar\n\nLo que haría por tu cuerpo\nsi te quedaras aquí\nte enseñaría melodías\nque no terminan al dormir\n\nLo que haría por tu cuerpo\nsi aprendieras a sentir\nporque el placer es un idioma\ny yo lo hablo desde antes de ti\n\n[Outro]\nBlueprint… You get a boot print… 'Cause I'm the blueprint…\nY todavía estás buscando el mapa…\nMientras yo ya conozco la ciudad."},
{t:"Mamá",g:"F",l:"english",b:"[Song for Mama]\n\nI never noticed it growing up\nThat from time to time the times was tough\nI gotta bless my mom for that\nShe gave me everything she had\nAnd she was all I had\nI never knew my dad\n\nBut I never really cared, honestly\nI had my momma\nAnd I swear it was enough for me\nBut she deserved so much more\nThis precious Black Pearl should have been adored\n\n[Chorus]\nThank you mama for believing in me\nFor dealing with me. For even living with me\nFor all you've given to me. For putting up with me\nFor giving love to me. I thank you\n\nThank you mama for holding me down\nKeeping my feet on the ground. For always being around\nYou're the best I know. And I'm so blessed I know\nI wrote this song to show. I thank you\n\nSaturday was family day\nThough she never had too much time to play\nShe had to do the laundry and then cook the food\nNo matter what she was making. It was always smelling good\n\nWe would listen to her forty fives\nI swear sometimes that music kept our souls alive\nShe always knew every single word to every song\nAnd we would sing along, our voices so strong\nI started on this music thing, thought it was so cool\n\nAnd joined the jazz and gospel choirs up in high school\nThanks to old school, mom, and Marvin Gaye\nMy mamma's star was born on a Saturday\n\n[Bridge]\nAnd I know heaven must be missing an angel\nMissing an angel child 'cuz you're here with me right now\n\n[Verse]\nShe holds her coat closed. Against the city wind\nA hollow sound on a lonely street\nNever thought she'd need a friend\nShe feels her best isn't good enough\nWhen the sky is always gray\nI hope she knows even when times are tough\nI still love her anyway\n\n[Final Chorus]\nI hope you know that you are precious to me\nAnd that your love is so special to me"},
{t:"Mauvaise \"Good Girl\"",g:"F",l:"french",b:"[Refrain]\nOn ne veut pas s'installer, jouons à la maison,\nToi le Daddy, moi la good girl à raison.\nSi j'obéis pas, je sais ce qui viendra—\nMais le problème, \"Papa,\" c'est que j'aime ça.\n\n[Couplet 1]\nLa porte se ferme, ta journée s'efface,\nLa cravate tombe, tu souffles enfin ta place.\nJe porte qu'un tablier, des talons et un sourire,\nL'odeur du dîner, un jeu pour te séduire.\nJe me penche au four, la chaleur me trahit,\nTon ombre m'entoure, je sais ce qui suit.\nLe rôti brûlé, la fumée dans la pièce,\nCeinture à la main — « mauvaise good girl, je redresse. »\n\n[Couplet 2]\nSamedi matin, toi devant les infos,\nLe café à la main, me lançant des signaux.\nMoi à quatre pattes, en costume de soubrette,\nJe frotte le sol, sous ton regard de tempête.\nDu bout du pied tu montres une trace,\nJe rampe, docile, vers l'endroit que tu traces.\nPuis à genoux devant toi, je soutiens ton regard—\nLe linge attendra demain… ce soir, c'est ton devoir.\n\n[Couplet 3]\nDimanche matin, les crêpes bien dorées,\nLe beurre qui fond, tes yeux à m'observer.\nJe verse le sirop, il glisse au mauvais endroit,\nSucré sur tes jambes, je souris comme si c'était pas.\nTu poses ta fourchette, sérieux comme un roi,\n\"Nettoie ça, ma belle, juste ici devant moi.\"\nFausse autorité, mais ton jeu est clair—\nOn sait très bien où nous mène cette affaire.\n\n[Pont]\nParfois j'me demande si les voisins entendent,\nLes claques de ta main, mes soupirs brûlants.\nEt les sons après, mélange doux et sauvage—\nNos jeux interdits écrivent leur propre passage.\n\n[Refrain final]\nOn ne veut pas s'installer, jouons à la maison,\nToi le Daddy, moi la good girl à raison.\nSi j'obéis pas, je sais ce qui viendra—\nMais le problème, \"Papa,\" c'est que j'aime ça.\nOui, le problème, \"Papa,\" … c'est que j'aime ça."},
{t:"Maybe a Maybe",g:"F",l:"english",b:"[Verse 1]\nYou fix what's broke, you text back fast\nWe talk and joke and the time just pass\nYou're a real one—and that's for sure\nBut you keep hinting that you want even more\n\n[Chorus]\nWhen you said good night, I thought I heard baby\nYou're not a yes, you're maybe a maybe\nI see you bringing a lot to the table\nBut why flip it now\nWhen the legs are so stable?\n\nOooooooh\n\n[Verse 2]\nYou bring me food, I braid your hair [laughs]\nYou know my moods by the shoes I wear\nWe good so far but now I find\nYou subtly starting to shift the line\n\n[Chorus]\nWhen you said good night, I thought I heard baby\nYou're not a yes, just maybe a maybe\n\n\"I see you moving smooth through these waters,\nBut don't go rocking the boat just to feel something harder.\"\n\nWhoa\n\n[Bridge]\nLet's redefine what closeness means\nNo blurry lines or in-between\nNo need to cross a sacred line\nFor anyone to need to say, \"You're mine\"\nThis is a yes wrapped in a no\nIt's love, just maybe not the kind you know\n\n[Chorus]\nWhen you said good night, I thought I heard baby\nYou're not a yes, you're maybe a maybe\nI'm grateful for you. That much I can say\nbut if you keep pushing me, you might push me away.\nI like having you around and I want you to stay.\nCan't let's just enjoy today before it goes away?\nJust let it be what it is\nBecause it's nice like this\n\n[Outro]\nLate bloom. You already know. Never too late. Beginning to flow (x3)"},
{t:"Pájaro Bonito",g:"F",l:"spanish",b:"[Intro — acoustic guitar, guiro and congas]\n\n[Verse 1 — male vocals]\nVi un pájaro volando\nTan hermoso en el cielo\nSus colores brillantes\nMe robaron el sueño\nPensé qué lindo sería\nTenerlo aquí conmigo\nSu canto me encantaba\nQuería ser su amigo\nMe imaginé cuidándolo\nDándole todo mi amor\n\n[Chorus]\nPájaro bonito, vuela lejos\nPájaro bonito, seguí tu vuelo\nPensé que te quería cerca\nPero mejor te quedas en el cielo\n\n[Verse 2]\nPero luego pensé en la jaula\nEn limpiar cada día\nLos gritos por la mañana\nQué pesadilla sería\nLas plumas por toda la casa\nLas semillas en el piso\nY si se escapa un día\n¿Qué hago con ese compromiso?\nLa realidad me golpeó\nComo un balde de agua fría\n\n[Bridge]\nNo te voy a mentir, pensé en derribarte del cielo\nComo mis hermanos de chicos, con una piedra o con fuego\nSi te caes, te puedo tener aunque sea sin vida\nPero esa no soy yo, esa no es mi salida\n\nEs lindo mirarte de lejos, soñar con tu libertad\nNi jaula ni bala, mejor dejarte volar\n\n[Chorus]\nPájaro bonito, vuela lejos\nPájaro bonito, seguí tu vuelo\nMe conformo con admirarte\nDesde aquí, desde el suelo\n\nPájaro bonito, vuela alto\nYo me quedo tranquila\nEs mejor así de simple\nSin drama ni pesadilla\n\n[Outro]\nCapaz que me debería conseguir un perro\nO un cuy\n[laughing]\nLo logré."},
{t:"Pas comme ça",g:"M+F",l:"french",b:"[Male, haletant] Un... Deux... Tourne... Non.... Pas Comme Ça\n\n[Couplet 1 — Male]\nSalle sévère, sueur sur les heures, tes erreurs réveillent ma rage intérieure. Je corrige tes hanches, ton angle, ta hauteur, professeur précieux prisonnier de sa propre rigueur.\nTes pivots paresseux piétinent ma ferveur, tes pauses me provoquent comme de lentes brûlures. Tourne. Encore. Plus net. Plus fort. Meilleur. Mais tes yeux me regardent sans la moindre peur.\n\n[Pré-refrain — Male]\nJe voulais une élève légère. Une silhouette simple. Une partenaire docile.\nPas cette présence électrique qui me défie comme une lame sous la gorge.\n\n[Refrain — Female]\nArrête de jouer le matador... Arrête de jouer le matador... Arrête de jouer le matador...\nSinon, moi, je vais jouer le taureau.\nTu veux conduire le corps sans réveiller la bête.\nMais mes talons tracent des guerres sur le parquet noir. Et plus tu me pousses, plus je deviens bizarre.\n\n[Couplet 2 — Male]\nToute la journée tu trembles en tournant, mâchoire serrée, souffle suffocant. Je parle trop fort. Tu réponds presque en chantant. Fatiguée physiquement, fatiguée émotionnellement.\nPuis je crie encore.\nEt soudain tu avances lentement.\nComme si quelque chose cassait dans l'air. Comme si la colère te rendait plus légère.\n\n[Pré-refrain — Male]\nJe voulais contrôler le feu. Le rendre élégant. Le rendre obéissant.\nMais chaque ordre devient essence sur ton insolence.\n\n[Refrain — Female]\nArrête de jouer le matador... Arrête de jouer le matador... Arrête de jouer le matador...\nSinon, moi, je vais jouer le taureau.\nTes leçons deviennent des morsures. Tes silences sentent la brûlure. Et mes hanches frappent le tempo comme des talons contre un tambour.\n\n[Bridge — silence presque total]\n[Male, haletant] Un... Deux... Tourne...\n[Sound] bracelet qui claque, chaussure qui glisse\n[Female, dans son oreille] SYBAU.\nFerme ton cul de pute.\n\n[Silence]\n\n[Couplet 3 — Male]\nQuelque chose {t:"Que les corps",g:"M",l:"french",b:"[Intro – bandonéon psychédélique]\nSous le lampadaire la rue silencieuse, tes cheveux bruns défaits frôlant mon cou.\nTes yeux disaient déjà ce que je savais... et moi je riais\ncomme si c'était. Que les corps.\n\n[Couplet]\nTon bassin contre le mien, Il serait si simple de rester. Ta peau sous mes doigts me demandait\nPlus de temps\nLa nuit entrouverte rien que pour nous deux. Et moi si fier de te nier\n\n[Incantation]\npas grand-chose. Non non Pas grand-chose.\nQue les corps. Que les corps.\n\n[Refrain]\nQue les corps... je dis en riant comme si c'était vrai. Que les corps... mais tes yeux refusent de me laisser.\nSous ce lampadaire je t'ai tenue si près... et au lieu de t'embrasser j'ai laissée le moment passer.\n\n[Petit couplet]\nLe moteur allumé, la radio qui chante. La rue vide Les chansons me guident\nEt à chaque coin revient le même refrain :\nj'aurais dû t'embrasser. J'aurais dû rester.\n\n[Refrain – répétitif]\nQue les corps... je répète comme si c'était vrai. Que les corps... mais ton ombre reste à ma côté.\nQue les corps... je mens en te revoyant sous ce lampadaire Mais la vérité Était en plein air\n\n[Final – vingt ans plus tard]\nEt maintenant dans le lit vingt ans plus tard la nuit revient comme un joli cauchemar\nTes yeux, ta grâce, la douceur de tes bras exactement pareil...\net moi, enfin Je vois ce que c'était\nPas grand-chose? Si si Quelque chose\nPlus que les corps, je sens dans ton cœur\nTout ce temps-là c'était déjà nous deux\nEt dans ce silence si doux, si tard\nje murmure en paix :\nc'était l'amour, Je sais trop tard."},
{t:"Quem é doido",g:"F",l:"portuguese",b:"Nunca fui um segredo sujo antes.\nSempre fui exibida com orgulho, como um troféu ou um adorno no braço.\nTalvez seja porque você me quer… mas não me quer de verdade.\nAinda está jogando joguinhos, porque é um garoto — e eu entendo isso.\nMas você complica tanto o que poderia ser tão simples… e divertido.\n\nQuem é doido dododo!!\nQuem é doido dododo\n\nTalvez você tenha medo que a mamãe te dar umas boas palmadas\nse te visse esfregando esse corpinho macio numa mulher da idade dela.\nProvavelmente eu tenho mais em comum com ela do que com você.\nEmbora, pensando bem, acho que não dividimos o gosto por homens.\nOu será que sim?\nComo é que seu pai se parece?\nTô brincando. 😜😆\n\nQuem é doido!! dododo\nQuem é doido!! dodo do\n\nVocê ainda tá por aí brincando feito criança,\nse vestindo de Superman, de ladrão de banco,\nde homem que não tem medo de jogar xadrez com a morte.\nVocê tem o machismo típico de um latino, sem dúvida.\nVai lá, meu bem, canta tuas músicas e mostra ao mundo o que tem.\nSua mãe e eu vamos estar aqui batendo papo enquanto assistimos você brilhar.\n\nQuem é doido!! dododo\nQuem é doido!! dododo\n\nQuem é doido!? Talvez eu.\nPorque eu quero jogar esses joguinhos com você,\nmas meus joelhos rangem quando me abaixo no chão pra brincar.\nVocê é um doce — não joga pesado.\nOu pelo menos, não tão pesado quanto eu gostaria, rs.\nMas também não joga justo.\nAcho que integridade é algo que a gente aprende com a idade… fazer o quê.\n\nQuem é doido!! dododo\nQuem é doido!! dododo\n\n[Falado] Tá bom…\nAcho que vou ser seu segredo sujo então… shhhhh 🤫"},
{t:"Sapiosexuelle",g:"F",l:"french",b:"[Verse 1]\nTu m'as dit cinq heures, j'ai cru rêver\nj'étais encore floue, entre soie et café\nMa lingerie noire, voilée, presque rien\nLa lumière rasait mes reins\nT'as frappé, t'étais déjà feu\nNattes serrées, regard soyeux\nIl est venu chez moi comme un prix à réclamer\nOn s'est glissés sous l'eau sans même parler\nSavon sur peau, souffles enchaînés\nIl est venu une fois, m'a dit qu'il reviendrait\nEt il est revenu—dur, sans prévenir\nMais trop vite encore, regard à fuir\nUn peu perdu, presque attendrissant\nLui deux, moi zéro—fin du temps\n\n[Chorus]\nY'a une brosse à dents dans le tiroir, ta place dans mon lit, c'est tous les soirs\nY'a un chargeur près de ton côté et mes jouets vibrés bien planqués\nJe dis pas que j'te veux tout le temps… mais je dis pas que non\nJ'me demande même pourquoi je m'attache à un mec qui m'a même pas fait jouir\nComment dirais-je… \"mindfuck,\" en Francis ? Sapiosexuelle.\n\n[Verse 2]\nTu ressembles à un mythe ancien\nQuelqu'un qu'on adore, qu'on touche à peine\nBeau et brillant, toujours trop loin\nTu bouges comme un mythe, mais tu vibres comme un piège\n\n[Verse 3]\nOn est distraits, toujours pressés\nÀ courir nos rêves, à fuir l'arrêt\nMais quand t'es là, le temps se tord\nJe te veux vivant, je te veux fort\n\n[Bridge]\nD'accord, t'as peut-être l'égo d'un homme trop petit—\nun complexe façon Napoléon, des silences en guise de couronne\nTu veux qu'on t'adore sans te dévoiler\nComme si j'avais jamais dompté des dieux d'or dans des corps glacés\nJe veux pas tout—juste quelqu'un qui sait\n\n[Outro]\nViens, Moisès—je peux même t'appeler \"Daddy\" encore… si tu veux."},
{t:"Self. Love",g:"F",l:"english",b:"[Verse 1]\nChecked the time — yep, it's fuck this shit o'clock\nDone waitin' for your maybe texts and half-assed talk\nYou had one job: act right, speak true\nInstead, you ghosted, lied, then cried — cute move\n\n[Pre-Chorus]\nI lit the candles, poured the wine\nPut on my playlist — damn, I'm fine\nAnd while you're out there \"figuring it out\"\nI'm over here feelin' myself out loud\n\n[Chorus]\nSo fuck it — I'll date my damn self\nTake me to dinner, toast to my health\nSend me good morning texts in my head\nBuy me that gift you forgot instead\n\nI'm hot, I'm booked, and I know my worth\nYou lost a goddess — I found the earth\nAnd baby, if this clock says anything else…\nIt's \"fuck this shit\" — I'm dating myself\n\n[Verse 2]\nYou want space? I gave you NASA\nYou want peace? I gave you silence faster\nNow you miss me? Oh, you nostalgic now?\nShould've thought that through before the meltdown\n\n[Bridge — Spoken/Soft]\nHonestly, I'm the whole date\nI'm the check, the vibe, the after-eight\nYou were a maybe, I'm a hell yes\nSo go play games — I'm playin' chess\n\n[Final Chorus — Power Mode]\nFuck it — I'll date my damn self\nRub my own feet, protect my mental health\nGet me flowers on a random day\nAnd moan at my jokes in a sexy way\n\nI've seen the stats, I've done the math\nYou were a detour — I'm the path\nSo set the time, and ring the bell —\nIt's fuck this shit o'clock\nAnd I'm dating myself\n\n[Outro — Whispered & Wine-Drunk]\nDon't wait up. I'm seeing someone.\nShe's amazing."},
{t:"Sorry for the Inconvenience",g:"F",l:"english",b:"I'm sorry I asked too much\nI'm sorry I held so fast\nAnd for so long\nTo you &\nOur love, anachronism\nAnomaly of sorts\nAnd out of sorts as I am\nI can't help but wonder\nAbout this loneliness\nDisquieted\nYet still quiet\nAnd tranquil\nLike cut flowers\n\nYour scars are not like mine\nYour scars are not mine\nSorry for the inconvenience."},
{t:"Sugar Mama",g:"F",l:"english",b:"[laughter]\n\nYou said, \"Be my sugar mama,\" like that shit was cute\nLike I ain't got babies who come way before you.\nTried to make me feel small, called me names in a flash\nBut I'm solid gold, baby — you just talkin' trash\n\n[Pre-Chorus]\nThought I'd be flattered by broke boy swagger?\nServing up pity with a side of dagger\nI raise babies, not grown-ass men\nYou lost your chance — don't text again\n\n[phone sound]\n\n[Chorus]\nSugar mama? Nah, nah, nah— I got bills and dreams\nYou ain't sweet, just full of schemes\nYou are kinda funny and kinda fun\nYour broke boy charm can't fuck with my funds\n\n[cough]\n\n[Verse 1]\nYou asked for a lighter, I offered a flame\nThree bucks of kindness, you played a game\nTurned slick in a second, called me your bank\nBut I don't fund delusions, you can keep that stank\n\n[Pre-Chorus]\nThought I'd be flattered by broke boy swagger?\nSippin' on pity with a side of dagger\nI raise babies, not grown-ass men\nYou lost your chance — don't text again\n\n[Chorus]\nSugar mama? Nah, negro, nah — I got bills and dreams\nYou ain't sweet, just full of schemes\nYou are kinda funny and kinda fun\nYour broke boy charm can't fuck with my funds\n\n[Verse 2]\nNow you're back like \"heyy\" and acting brand new\nForget what you said? I remember the view\nCalled me old, weird, irrelevant shade\nBut I age like wine and you just afraid\n\n[Chorus]\nSugar mama? Nah, ninny, nah — I got bills and dreams\nYou ain't sweet, just full of schemes\nYou are kinda funny and kinda fun\nYour broke boy charm can't fuck with my funds\n\n[Bridge]\n\"You still in town?\" — oh now I'm cute?\nMiss me with that shit, your split-flip substitute\nMessenger chats? Nah, I'm off your script\nYou missed the cues— now watch me dip\n\n[Chorus — Repeat]\nSugar mama? Nah, nah, nah — I got bills and dreams\nYou ain't sweet, just full of schemes\nYou are kinda funny and kinda fun\nYour broke boy charm can't fuck with my funds\nSwipe left on your sob story phase\nYour broke boy charm don't deserve a raise\n\n[Outro]\nSo take your lighter — spark your lies\nI'm lit without your lullabies\nGhost me once, then beg to stay?\nI'm the one that got away 🌬️\n\n[wind blowing]"},
{t:"Thank You Laura and Catonya",g:"F",l:"english",b:"[Verse 1]\nLaura comes in with a story to share,\nSomething about her kids or her day.\nRayne and Shyne bark to let us know she's near,\nAnd the room feels brighter when she's here.\n\nShe checks on mama like she's known her for years,\nshe's Someone my mom holds dear.\nShe keeps it real, just being herself,\nLike a friend who showed up to help.\n\n[Pre-Chorus]\nShe brings the world in with her care,\nMakes hard days easier to bear.\n\n[Chorus]\nThank you for showing up, like you do,\nFor being here, for being you.\nFor bringing care without a fuss,\nFor helping her — and helping us.\nWe don't always say it, but it's true,\nWe both thank God for you.\n\n[Verse 2]\nCut Tanya comes, so calm and sure,\nShe makes my mama feel secure.\ntalks about life, the things she's seen,\nKeeps it honest, real, and in-between.\n\nShe talks with her, and that really matters\nbrings solid sense when mom's thoughts scatter\nthe result, Cut Tanya of all you give\nis mom feels she's still got life left to live\n\n[Pre-Chorus]\nDifferent styles, same kind of love,\nBoth of them blessings from above.\n\n[Chorus]\nThank you ladies, both of you,\nFor all you give and all you do.\nFor the care you give, the time you spend,\nFor being nurses and friends.\nSo thank you for showing up, day by day,\nFor all the love you give away.\n\n[Bridge]\nMy mama's older, her world's grown small,\nAnd you've become a big part of it all.\nHer light is still lit, you help it shine,\nAnd the longer she's here, the longer she's mine.\n\n[Outro]\nThat's the truth —\nthe heart of it too.\nGod knows I'm grateful\nFor both of you."},
{t:"Thin Line",g:"F",l:"english",b:"[Verse 1]\nMaybe I'm too much for your quiet world,\nThe queen you behold don't match the rumors you heard\nI've been buried, been broken, and still I rise,\nWith a heart full of passion flying toward the open skies.\n\nSo ree reed your receipts, watch your whispered fears,\nCuz I'm dancing in the sun while you counting the years.\nSo If I'm not for you, that's okay it's fine, not a crime—\n'Cause you can hit the road, I'm just hitting my stride and my prime.\n\n[Chorus 1]\nThere's a thin line between genius and madness,\nAnd it's not a straight line, it's a spiraling axis.\nAnd it twists and it turns in labyrinth thin patterns\nBut You probably wouldn't know\n\nIt's sharp and it's hot, sweet and hypnotic,\nIf you can't handle that, that's fine — i got it.\nEight billion people on this planet, it's true—\nIf you don't like me, that's cool, I'll find billions who do\n\n[Verse 2]\nSo go on and gossip in your little crowd,\nToo transcendent to tone it down for you\nIf I'm too much, then maybe you're too small,\n'Cause I'm not out here auditioning for you all.\n\nI red your script, but I'm no fool,\nI don't played by rules that aren't my rules.\nWhen I wake up, I choose my song,\nIf that bothers you, then don't sing along.\n\n[Chorus 2]\nLife's too precious for a half-filled cup,\nAnd I'm just getting started, so buckle up.\nI've earned this voice, I've earned this view,\nAnd I don't need per mission from you.\nThis journey is between god and me alone\nThis life is my own, He and I built this throne.\nEight billion people spin on this blue design,\nDon't like me? That's fine—just step out of line\nEight billion people in this world of mine,\nDon't like me? No, I don't mind — I'll be just fine.\n\n[Outro]\nLate bloom. Never too late."},
{t:"Ton corps",g:"F",l:"french",b:"Hé mec, tu sais que tu la veux.\nC'est une déesse, et tu mérites une déesse.\nTu es un dieu — tu te souviens pas de la sensation de la peau ?\nTu te souviens pas de ce que ça fait, à l'envers et à l'endroit ?\nTu mérites le plaisir.\n\nPose ton corps sur son corps, d'accord, d'accord, d'accord.\nPose ton corps sur son corps, d'accord, d'accord, d'accord.\n\nAlors, qu'est-ce qui t'arrête ? Sois honnête… t'as peur ?\nJe sais, elle est intense. Elle est exquise, puissante.\nEt quand elle déploie toute sa créativité pour faire frissonner ton corps…\nqu'est-ce que tu peux faire ?\n\nPose ton corps sur son corps, d'accord, d'accord, d'accord.\nPose ton corps sur son corps, d'accord, d'accord, d'accord.\n\nTu l'appelles. Encore, encore, encore.\nParce qu'elle te veut.\""},
{t:"Tonight",g:"F",l:"english",b:"Hey man, you know you want her.\nShe's a goddess, and you deserve a goddess.\nYou're a god—don't you remember the feeling of her skin?\nDon't you remember what it's like with her, upside down and inside out?\nYou deserve her pleasure.\nLAY IT ON HER TONIGHT, alright, alright, alright.\n\nPUT IT on HER TONIGHT, alright, alright, alright.\nLAY IT ON HER TONIGHT, alright, alright, alright.\n\nPUT IT on HER TONIGHT, alright, alright, alright.\n\nSo what's stopping you? Be honest… you scared?\nI know—she's intense. She's exquisite, powerful.\nAnd when she channels all her creativity to make your body tremble…\nwhat can you even do?\n\nLAY IT ON HER TONIGHT, alright, alright, alright.\nPUT IT IN HER TONIGHT, alright, alright, alright.\nLAY IT ON HER TONIGHT, alright, alright, alright.\nPUT IT IN HER TONIGHT, alright, alright, alright.\n\nYou call her. Again, AND again, AND again.\nBecause she still wants you\nSo\n\nLAY IT ON HER TONIGHT, alright, alright, alright."},

{t:"Trickster",g:"F",l:"english",b:"[Multilingual — EN / FR / ES / PT / IT — see songs.json for full versions]\n\n[EN — Trickster]\nYou're a little trickster. So frisky. You tricked me.\nI didn't know. I didn't even suspect it was planned.\n\nThe first time you came over, we were just friends.\nWe talked about the music I've been making, and I geeked out.\nThen we danced barefoot in my kitchen.\nYou guided me with a firm hand at the small of my back.\n\"Sorry, profe.\"\nBut that stern look in your eyes just made me want to kiss you.\n\nI fell—innocently—into your trap. Into your arms.\n\nYou said you needed a shower before going to work.\nBy the time I came in to show you how to turn on the hot water,\nyou were already standing there—naked.\nBut the trick's on you— Because I loved every minute.\n\n[FR — Petit filou]\nPetit filou, Fripon frivole. Tu m'as flouée, Je n'ai rien flairé.\nMais le piège est pour toi—Parce que j'ai adoré chaque minute.\n\n[ES — Eres un pequeño embustero]\nEres un pequeño embustero. Tan travieso. Me engañaste.\nPero el truco fue tuyo— Porque yo disfruté cada minuto.\n\n[PT — Trapaceirinho]\nVocê é um trapaceirinho. Tão safado. Você me enganou.\nMas quem caiu na armadilha foi você— Porque eu amei cada segundo.\n\n[IT — Piccolo imbroglione]\nSei un piccolo imbroglione. Così birichino. Mi hai ingannata.\nMa il trucco è tuo— Perché ho amato ogni singolo minuto."},
{t:"Tu ne l'aimes pas",g:"M",l:"french",b:"Tu ne l'aimes pas. Tu ne l'aimes pas. Tu ne l'aimes pas.\n\nCarreaux couverts de chaleur. Salle de bain, sueur, stupeur. Je fixe mes propres yeux comme deux juges dangereux.\n\nPaume contre porcelaine. Poing contre poitrine pleine. \"Tu ne l'aimes pas.\" Je répète ça comme une prière mécanique pour survivre à la panique.\n\nTac. Tac. Tac sur le lavabo blanc.\n\nMais dans la glace... quelque chose change lentement.\n\nTes yeux glissent dans mes iris. Tes cils traversent mon reflet fissuré.\n\nEt soudain je respire de travers.\n\nL'amour dilate. La peur contracte.\nAlors mon corps se combat.\n\nJe marche, je mâche, je mens.\n\nChewing-gum amer entre mes dents tremblantes. Le goût de menthe mélangé à ton absence brûlante.\n\n\"Tu ne l'aimes pas.\"\n\nMais mon souffle bégaie.\n\nBuée blanche. Bouche sèche. Battements brutaux.\n\nTon nom tourne dans les tuyaux, dans les carreaux, dans ma gorge qui déborde.\n\nUn. Deux. Non. Encore.\n\nJe frappe le miroir.\n\nUne fois pour le silence. Deux fois pour le mensonge. Trois fois pour ton visage qui refuse de mourir dans le mien.\n\n\"Tu ne l'aimes pas !\"\n\nMa voix casse. La vitre tremble. Mes veines vibrent.\n\nMais tes yeux... tes foutus yeux...\nplus je les chasse, plus ils brillent dans les éclats de glace.\n\nAlors je cogne.\n\nFort. Fort. Fort.\n\nJusqu'à voir mon reflet exploser en étoiles coupantes.\n\nSilence. Respiration. Sang sur mes phalanges.\n\nEt dans chaque morceau de miroir... toi."},
{t:"Unravel",g:"F",l:"english",b:"And should it all unravel\nuncross\nThe fabric of us, the paths of our stars\nKnow\nThat even in complete darkness\nThe love was real\nThe tears were real\nAnd each breath you breathed\nDisarmed me\n\nAnd should we never be\nMore, again\nAnd forever\nKnow\nThat I tried\n\nAnd even in our one days\nFar apart and different\nRemember the little girl and her big heart\nRemember what she gave"},
{t:"Useless",g:"F",l:"english",b:"[Verse 1]\nCan I tell you my ideas of how to pass the hours?\nWeaving sweet nothings in your hair, smelling of flowers…\nJumping in puddles of moonbeam showers…\nDrinking in the afternoon light, the crimson sunset, making it ours?\n\n[Chorus]\nAnd it's completely useless for me to feel this way\nUseless to say all the things that I want to say\nUseless to imagine things in ways other than what they seem\nI guess I can't do anything right, but dream.\n\n[Verse 2]\nIs it all right with you if I leave poems by your door?\nIs it all right with your son if we cuddle on the floor?\nIs it all right with your daughter if I imagine how you snore?\nIs it all right with your wife if you don't come home anymore?\n\n[Bridge]\nAnd can I tell you how I feel when you go away?\nHow part of me goes with you every day…\nHow goodbye is something I hate to say…\nHow I wish that you could stay… and play…\nStay, big baby, stay and play, yeah yeah.\n\n[Vamp]\nWhat if I kissed you, just to see\nOut of schoolgirl curiosity\nOf what kissing you might be? (2X)\nBesides an impossibility…"},
{t:"Valentine's Lament",g:"F",l:"english",b:"[Verse 1]\nOh god, oh God, he's in my head.\nI just might have to shoot him dead.\nI realize I'm falling fast,\nbut that'll stop with one quick blast.\n\n[Chorus #1]\nOh, I don't want to be in love, it's really not much fun.\nAnd there would be no one in love if I only had a gun.\nI'd kill them all. I'd shoot 'em down. I'd love to see them die.\nI'd rather bathe in blood then have them around; they only make me cry.\n\n[Verse 2]\nOh no, oh no, he just walked by.\nI may have to gouge out his eye.\nI'd like to go on one last date\nbefore I vow to seal his fate.\n\n[Chorus #2]\nOh, I don't want to be in love, it's grody to the max.\nAnd there would be no one in love if I only had an axe.\nI'd mince them up, decapitate, their bones and flesh I'd fry.\nBetter to eat them all and live with gas than let them make me cry.\n\n[Bridge — 3/4 time]\nOh I got hurt once before oh not again, no not again.\nI'd rather fall in bloody war than fall for men, then fall for men.\n\n[Verse 3]\nNot love, not love, it cannot be.\nHe just can't get the best of me.\n'fore I give in to love's cheap thrill,\nI'll bash his skull, his blood will spill.\n\n[Chorus #1 & #2 — repeat 2x]"}

const langs={english:"EN",french:"FR",spanish:"ES",portuguese:"PT",multilang:"MULTI"};
const sx=document.getElementById("sx"),ct=document.getElementById("ct");
let cf="all";
S.sort((a,b)=>a.t.localeCompare(b.t,undefined,{sensitivity:"base"}));
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
function renderBody(text){return text.replace(/\[([^\]]+)\]/g,'<span class="sec">$1</span>')}
S.forEach(s=>{const a=document.createElement("article");a.className="s";a.dataset.lang=s.l;a.innerHTML=`<div class="sh"><div class="st">${esc(s.t)}</div><div class="sm">${langs[s.l]||s.l.toUpperCase()} · ${esc(s.g)}</div></div><div class="sb">${renderBody(esc(s.b))}</div>`;sx.appendChild(a)});
function apply(){let n=0;document.querySelectorAll(".s").forEach(el=>{const sh=cf==="all"||el.dataset.lang===cf;el.classList.toggle("x",!sh);if(sh)n++});ct.textContent=n===1?"1 song":n+" songs"}
document.querySelectorAll(".ch").forEach(c=>c.addEventListener("click",()=>{document.querySelectorAll(".ch").forEach(x=>x.classList.remove("a"));c.classList.add("a");cf=c.dataset.v;apply()}));
document.addEventListener("click",e=>{const h=e.target.closest(".sh");if(h)h.parentElement.classList.toggle("o")});
apply();
