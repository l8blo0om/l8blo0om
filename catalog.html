<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L8 BLO0M — Collected Lyrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000000;
  --bg-elevated: #08081a;
  --text: #eef0ff;
  --text-dim: #7a8199;
  --text-faint: #3a3f4f;
  --accent: #00d9ff;
  --accent-dim: #b366ff;
  --line: #14142a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Syne', 'Outfit', sans-serif;
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
.container { max-width: 740px; margin: 0 auto; padding: 28px 16px 60px; }
.masthead { text-align: center; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.masthead h1 {
  font-family: 'Playfair Display', serif;
  font-weight: 400;
  font-size: 28px;
  letter-spacing: 0.2em;
  margin-bottom: 6px;
  background: linear-gradient(90deg, var(--accent), var(--accent-dim));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.masthead .tagline { font-style: italic; color: var(--text-dim); letter-spacing: 0.08em; font-size: 12px; }
.search-wrap { display: flex; justify-content: center; margin-bottom: 10px; }
.search-wrap input {
  width: 100%;
  max-width: 340px;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--text);
  padding: 6px 12px;
  border-radius: 100px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.1em;
  outline: none;
  transition: border-color 0.2s ease;
}
.search-wrap input:focus { border-color: var(--accent); }
.search-wrap input::placeholder { color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.2em; }
.count {
  text-align: center;
  color: var(--accent);
  font-family: 'Playfair Display', serif;
  font-size: 13px;
  letter-spacing: 0.35em;
  margin-bottom: 16px;
}
.songs { display: flex; flex-direction: column; }
.song { border-bottom: 1px solid var(--line); transition: background 0.2s ease; }
.song:first-child { border-top: 1px solid var(--line); }
.song.hidden { display: none; }
.song:hover { background: rgba(0, 217, 255, 0.04); }
.song.open { background: var(--bg-elevated); }
.song.open .song-title { color: var(--accent); }
.song-header {
  padding: 5px 8px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  user-select: none;
}
.song-title {
  font-family: 'Playfair Display', serif;
  font-size: 15px;
  font-weight: 400;
  letter-spacing: 0.01em;
  color: var(--text);
}
.song-body {
  padding: 0 12px 14px;
  display: none;
  white-space: pre-wrap;
  font-size: 15px;
  line-height: 1.5;
  color: var(--text);
}
.song.open .song-body { display: block; padding-top: 4px; }
.footer {
  text-align: center;
  margin-top: 32px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  color: var(--text-faint);
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}
.loading, .error {
  text-align: center;
  color: var(--text-dim);
  padding: 40px 20px;
  font-style: italic;
}
.error { color: var(--accent-dim); }
@media (max-width: 640px) {
  .song-header { padding: 5px 4px; gap: 8px; }
  .song-title { font-size: 14px; }
  .song-body { padding: 0 4px 12px; font-size: 14px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="masthead">
    <h1>L8 BLO0M</h1>
    <div class="tagline">— collected lyrics —</div>
  </div>
  <div class="search-wrap">
    <input id="search" type="text" placeholder="search">
  </div>
  <div class="count" id="count">loading…</div>
  <div class="songs" id="songs">
    <div class="loading">Loading lyrics…</div>
  </div>
  <div class="footer">L8 BLO0M · lyrics · 🌺</div>
</div>

<script>
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function parseArchive(text) {
  const lines = text.split(/\r?\n/);
  const songs = [];
  let i = 0;
  while (i < lines.length && !/^L8 BLO0M: COLLECTED LYRICS$/i.test(lines[i].trim())) i++;
  if (i < lines.length) i++;
  while (i < lines.length) {
    while (i < lines.length && lines[i].trim() === '') i++;
    if (i >= lines.length) break;
    const title = lines[i].trim();
    i++;
    if (i < lines.length && lines[i].trim() === '') i++;
    const bodyLines = [];
    while (i < lines.length) {
      if (lines[i].trim() === '' && i + 1 < lines.length && lines[i + 1].trim() === '') break;
      bodyLines.push(lines[i]);
      i++;
    }
    while (bodyLines.length && bodyLines[bodyLines.length - 1].trim() === '') bodyLines.pop();
    if (title) songs.push({ title, body: bodyLines.join('\n') });
  }
  return songs;
}
function render(songs) {
  const container = document.getElementById('songs');
  container.innerHTML = '';
  songs.slice()
    .sort((a, b) => a.title.localeCompare(b.title, undefined, { sensitivity: 'base', numeric: true }))
    .forEach(song => {
      const article = document.createElement('article');
      article.className = 'song';
      article.dataset.title = song.title.toLowerCase();
      article.dataset.body = song.body.toLowerCase();
      article.innerHTML = `
        <div class="song-header">
          <div class="song-title">${escapeHtml(song.title)}</div>
        </div>
        <div class="song-body">${escapeHtml(song.body)}</div>
      `;
      article.querySelector('.song-header').addEventListener('click', () => {
        article.classList.toggle('open');
      });
      container.appendChild(article);
    });
  updateCount();
}
function updateCount() {
  const visible = document.querySelectorAll('.song:not(.hidden)').length;
  document.getElementById('count').textContent = visible === 1 ? '1 song' : visible + ' songs';
}
document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.song').forEach(song => {
    const match = !q || song.dataset.title.includes(q) || song.dataset.body.includes(q);
    song.classList.toggle('hidden', !match);
  });
  updateCount();
});
fetch('L8_BLOOM_COLLECTED_LYRICS.md?v=' + Date.now())
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
  .then(text => {
    const songs = parseArchive(text);
    if (!songs.length) {
      document.getElementById('songs').innerHTML =
        '<div class="error">No songs found in L8_BLOOM_COLLECTED_LYRICS.md</div>';
      document.getElementById('count').textContent = '';
      return;
    }
    render(songs);
  })
  .catch(err => {
    document.getElementById('songs').innerHTML =
      '<div class="error">Could not load L8_BLOOM_COLLECTED_LYRICS.md — ' +
      escapeHtml(err.message) + '</div>';
    document.getElementById('count').textContent = '';
  });
</script>
<div style="text-align:center;padding:0 0 2rem;font-size:0.7rem;color:#8888a0;letter-spacing:0.08em;" id="visit-counter"></div>
<script>
(function(){var s=(location.pathname.split('/').pop()||'home').replace('.html','')||'home';
fetch('https://api.counterapi.dev/v1/l8blo0om/'+s+'/up').then(function(r){return r.json()}).then(function(d){
var el=document.getElementById('visit-counter');if(el&&d.count)el.textContent=d.count.toLocaleString()+' visits';}).catch(function(){});})();
</script>
<script data-goatcounter="https://l8blo0om.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
